<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ══ SEO ESSENTIALS ══ -->
  <title>AI & Tech News — Web Online Tools Blog</title>
  <meta name="description" content="Daily AI-researched articles covering the latest in artificial intelligence, developer tools, and web technology. Updated automatically." />
  <meta name="keywords" content="AI news, tech blog, web development news, automation, artificial intelligence updates" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://webonlinetools.com/ai-news/" />
  
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#060b18" />
  <link rel="icon" type="image/svg+xml" href="https://webonlinetools.com/favicon.svg" />

  <!-- ══ STRUCTURED DATA ══ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Web Online Tools - AI & Tech News",
    "description": "Daily AI-researched articles covering the latest in artificial intelligence, developer tools, and web technology.",
    "url": "https://webonlinetools.com/ai-news/",
    "publisher": {
      "@type": "Organization",
      "name": "Web Online Tools",
      "logo": { "@type": "ImageObject", "url": "https://webonlinetools.com/favicon.svg" }
    }
  }
  </script>

  <!-- ══ FONTS & TAILWIND ══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ════ DESIGN TOKENS ════ */
    :root {
      --surface:      #060b18;
      --card:         #0d1225;
      --border:       rgba(255,255,255,0.07);
      --border-act:   rgba(99,179,237,0.4);
      --grad-main:    linear-gradient(135deg, #2563eb 0%, #06b6d4 55%, #10b981 100%);
      --grad-text:    linear-gradient(135deg, #60a5fa 0%, #22d3ee 50%, #34d399 100%);
      --grad-card:    linear-gradient(145deg, rgba(37,99,235,0.04) 0%, rgba(16,185,129,0.02) 100%);
      --t1: #f8fafc;
      --t2: #94a3b8;
      --t3: #475569;
      --font-display: 'Syne', sans-serif;
      --font-body:    'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--font-body); background: var(--surface); color: var(--t2);
      line-height: 1.65; -webkit-font-smoothing: antialiased; position: relative;
    }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 15% 15%, rgba(37,99,235,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 85% 75%, rgba(16,185,129,0.05) 0%, transparent 55%);
    }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

    /* ══ HEADER ══ */
    .site-header {
      position: sticky; top: 0; z-index: 200; background: rgba(6,11,24,0.85);
      backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; }
    .logo-mark {
      width: 38px; height: 38px; background: var(--grad-main); border-radius: 11px;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(37,99,235,0.3);
    }
    .logo-text { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; color: var(--t1); letter-spacing: -0.03em; }
    .logo-text em { font-style: normal; background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ══ MASTHEAD & SEARCH ══ */
    .masthead { padding: 4rem 0 3rem; border-bottom: 1px solid var(--border); margin-bottom: 3rem; }
    .masthead-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
    
    .masthead-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #60a5fa; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .masthead-label::before { content: ''; display: inline-block; width: 30px; height: 2px; background: var(--grad-main); border-radius: 2px; }
    
    .masthead h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--t1); }
    .masthead h1 em { font-style: normal; background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .masthead-meta { text-align: right; }
    .masthead-meta .date-tag { font-size: 0.85rem; color: var(--t3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .masthead-meta .post-count { font-size: 2.5rem; font-family: var(--font-display); font-weight: 800; color: var(--t1); display: block; line-height: 1; margin-top: 0.5rem; }
    .masthead-meta .post-count span { font-size: 0.9rem; font-family: var(--font-body); color: var(--t3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .search-box { position: relative; max-width: 600px; margin-bottom: 4rem; z-index: 10; }
    .search-input { width: 100%; padding: 1.15rem 1.5rem 1.15rem 3.5rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 16px; color: var(--t1); font-family: var(--font-body); font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s; }
    .search-input:focus { border-color: var(--border-act); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
    .search-input::placeholder { color: var(--t3); }
    .search-ico { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--t3); pointer-events: none; }

    /* ══ HERO POST ══ */
    #hero-section { margin-bottom: 5rem; transition: opacity 0.3s; }
    .hero-post { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 24px; overflow: hidden; background: var(--card); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); min-height: 400px; text-decoration: none; position: relative; }
    .hero-post::after { content: ''; position: absolute; inset: 0; background: var(--grad-card); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    .hero-post:hover { border-color: rgba(59,130,246,0.5); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(59,130,246,0.15); }
    .hero-post:hover::after { opacity: 1; }

    .hero-visual { background: radial-gradient(circle at center, rgba(59,130,246,0.15) 0%, transparent 70%), #030712; display: flex; align-items: center; justify-content: center; position: relative; border-right: 1px solid var(--border); }
    .hero-visual-icon { width: 90px; height: 90px; border-radius: 20px; background: var(--grad-main); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(59,130,246,0.4); position: relative; z-index: 2;}

    .hero-content { padding: 3rem; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
    .hero-badges { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.4rem 0.8rem; border-radius: 8px; }
    .badge-featured { background: var(--grad-main); color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
    .badge-ai { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--t2); }
    
    .hero-date { font-size: 0.8rem; color: var(--t3); margin-bottom: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .hero-title { font-family: var(--font-display); font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 800; line-height: 1.2; color: var(--t1); margin-bottom: 1.25rem; letter-spacing: -0.02em; }
    .hero-excerpt { font-size: 1rem; color: var(--t2); line-height: 1.7; margin-bottom: 2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-cta { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 700; color: #60a5fa; transition: gap 0.2s; }
    .hero-post:hover .hero-cta { gap: 0.75rem; color: #93c5fd; }

    /* ══ GRID SECTION ══ */
    .section-head { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem; }
    .section-head-label { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--t1); white-space: nowrap; }
    .section-head-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

    .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 4rem; }
    
    .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); text-decoration: none; position: relative; overflow: hidden; }
    .post-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad-main); opacity: 0; transition: opacity 0.3s; }
    .post-card:hover { transform: translateY(-5px); border-color: var(--border-act); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
    .post-card:hover::before { opacity: 1; }

    .post-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .post-number { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; color: var(--t3); }
    
    .post-card-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; line-height: 1.4; color: var(--t1); margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color 0.2s; }
    .post-card:hover .post-card-title { color: #60a5fa; }
    
    .post-card-excerpt { font-size: 0.9rem; color: var(--t2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1.5rem; flex: 1; }

    .post-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .post-arrow { color: var(--t3); transition: color 0.2s, transform 0.2s; }
    .post-card:hover .post-arrow { color: #60a5fa; transform: translateX(4px); }

    /* ══ STATES & BUTTONS ══ */
    .load-more-wrap { text-align: center; margin: 3rem 0 5rem; }
    .btn-ghost { background: rgba(255,255,255,0.04); color: var(--t1); border: 1px solid var(--border); font-family: var(--font-body); font-weight: 700; font-size: 0.95rem; padding: 1rem 2.5rem; border-radius: 12px; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: var(--border-act); box-shadow: 0 0 20px rgba(59,130,246,0.1); }

    .state-box { text-align: center; padding: 6rem 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 24px; color: var(--t2); margin-bottom: 4rem; }
    .state-box svg { margin: 0 auto 1.5rem; width: 64px; height: 64px; color: var(--t3); }
    .state-box p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .state-box a, .state-box span { color: #60a5fa; font-weight: 700; text-decoration: none; }
    .state-box a:hover { text-decoration: underline; }

    /* Skeletons */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Responsive */
    @media (max-width: 900px) {
      .post-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-post { grid-template-columns: 1fr; }
      .hero-visual { padding: 4rem; border-right: none; border-bottom: 1px solid var(--border); }
    }
    @media (max-width: 640px) {
      .post-grid { grid-template-columns: 1fr; }
      .masthead-inner { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .hero-content { padding: 2rem; }
    }

    .site-footer { border-top: 1px solid var(--border); padding: 3rem 0; text-align: center; font-size: 0.85rem; margin-top: auto;}
  </style>
</head>
<body class="flex flex-col min-h-screen">

<header class="site-header">
  <div class="wrap">
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
        <span class="logo-text">Web <em>Online</em> Tools</span>
      </a>
      <nav class="hidden md:flex gap-6 font-semibold text-sm">
        <a href="/tools/" class="text-slate-400 hover:text-white transition">All Tools</a>
        <a href="/ai-news/" class="text-white">Blog</a>
      </nav>
    </div>
  </div>
</header>

<main class="flex-grow">
  <!-- ── Masthead ── -->
  <div class="wrap">
    <header class="masthead">
      <div class="masthead-inner">
        <div>
          <div class="masthead-label">Daily Intelligence</div>
          <h1>AI & Tech <em>News</em></h1>
        </div>
        <div class="masthead-meta">
          <span class="date-tag" id="today-date">Updated Daily</span>
          <span class="post-count" id="post-count-display">— <span>articles</span></span>
        </div>
      </div>
      
      <!-- ── Search Box ── -->
      <div class="search-box mt-8">
        <svg class="search-ico w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="blog-search" class="text-input" placeholder="Search articles, topics, AI tools..." oninput="handleSearch(this.value)">
      </div>
    </header>
  </div>

  <div class="wrap">
    <!-- ── Hero Post Section ── -->
    <section id="hero-section">
      <div class="hero-post" id="hero-skeleton" style="pointer-events: none;">
        <div class="hero-visual"><div class="skeleton w-24 h-24 rounded-2xl"></div></div>
        <div class="hero-content">
          <div class="skeleton h-4 w-24 mb-6"></div>
          <div class="skeleton h-10 w-full mb-3"></div>
          <div class="skeleton h-10 w-3/4 mb-6"></div>
          <div class="skeleton h-4 w-full mb-2"></div>
          <div class="skeleton h-4 w-full mb-2"></div>
          <div class="skeleton h-4 w-2/3 mb-8"></div>
          <div class="skeleton h-10 w-32 rounded-lg"></div>
        </div>
      </div>
      <div id="hero-post-container" class="hidden"></div>
    </section>

    <!-- ── Grid Section ── -->
    <section id="feed-section">
      <div class="section-head" id="grid-header" style="display:none;">
        <h2 class="section-head-label" id="grid-header-label">Archive</h2>
        <div class="section-head-line"></div>
      </div>

      <!-- Skeletons -->
      <div class="post-grid" id="grid-skeleton">
        <div class="post-card"><div class="skeleton h-4 w-12 mb-6"></div><div class="skeleton h-6 w-full mb-2"></div><div class="skeleton h-6 w-3/4 mb-4"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-full mb-2"></div></div>
        <div class="post-card hidden sm:flex"><div class="skeleton h-4 w-12 mb-6"></div><div class="skeleton h-6 w-full mb-2"></div><div class="skeleton h-6 w-3/4 mb-4"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-full mb-2"></div></div>
        <div class="post-card hidden md:flex"><div class="skeleton h-4 w-12 mb-6"></div><div class="skeleton h-6 w-full mb-2"></div><div class="skeleton h-6 w-3/4 mb-4"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-full mb-2"></div></div>
      </div>

      <!-- Real Grid -->
      <div class="post-grid" id="post-grid" style="display:none;"></div>

      <!-- Pagination Controls -->
      <div class="load-more-wrap hidden" id="load-more-wrap">
        <button class="btn-ghost" onclick="loadMore()">
          Load More Articles
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
      </div>

      <!-- Empty Search State -->
      <div id="search-empty-state" class="hidden">
        <div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <p>No articles found for "<span id="search-term-display" class="text-white"></span>".</p>
          <button onclick="document.getElementById('blog-search').value = ''; handleSearch('');" class="btn-ghost mt-4 w-auto">Clear Search</button>
        </div>
      </div>

      <!-- Fetch Error State -->
      <div id="error-state" class="hidden">
        <div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          <p>Could not load articles at this time.<br>Please try refreshing the page.</p>
          <a href="/">&larr; Return to Homepage</a>
        </div>
      </div>

    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 Web Online Tools. Automated Intelligence Daily.</p>
  </div>
</footer>

<script>
  /* ── UTILITIES ── */
  const extractTitle = (html, slug) => {
    const match = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
    if (match) { const t = document.createElement('div'); t.innerHTML = match[1]; return t.textContent.trim(); }
    return slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  };

  const extractMeta = html => {
    const match = html.match(/<!--\s*META:\s*(.*?)\s*-->/i);
    return match ? match[1].trim() : null;
  };

  const extractExcerpt = (html, max = 150) => {
    let t = html.replace(/<(script|style|h1|h2|h3)[^>]*>[\s\S]*?<\/\1>/gi, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max).replace(/\s\S*$/, '') + '…' : t;
  };

  const extractDate = html => {
    const match = html.match(/<!--\s*generated:\s*(\d{4}-\d{2}-\d{2})/i);
    return match ? new Date(match[1]).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : null;
  };

  /* ── RENDERERS ── */
  const renderHero = post => `
    <a href="${post.url}" class="hero-post">
      <div class="hero-visual">
        <div class="hero-visual-icon">
          <svg viewBox="0 0 24 24" stroke="#fff" fill="none" stroke-width="2" style="width: 36px; height: 36px;">
            <path d="M12 2a9.96 9.96 0 0 1 6.29 2.23M12 2a9.96 9.96 0 0 0-6.29 2.23M21.54 9A10 10 0 0 1 22 12M2.46 9A10 10 0 0 0 2 12M12 22a9.96 9.96 0 0 0 6.29-2.23M12 22a9.96 9.96 0 0 1-6.29-2.23M21.54 15A10 10 0 0 1 12 22M2.46 15A10 10 0 0 0 12 22"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </div>
      <article class="hero-content">
        <div class="hero-badges">
          <span class="badge badge-featured">Featured</span>
          <span class="badge badge-ai">Automated Feed</span>
        </div>
        ${post.date ? `<time class="hero-date" datetime="${post.date}">${post.date}</time>` : ''}
        <h2 class="hero-title">${post.title}</h2>
        <p class="hero-excerpt">${post.excerpt}</p>
        <span class="hero-cta">Read full intelligence report &rarr;</span>
      </article>
    </a>`;

  const renderCard = (post, idx) => `
    <a href="${post.url}" class="post-card">
      <div class="post-card-top">
        <span class="post-number">NO.${String(idx + 1).padStart(2,'0')}</span>
        ${post.date ? `<time class="badge badge-ai" datetime="${post.date}">${post.date}</time>` : ''}
      </div>
      <h3 class="post-card-title">${post.title}</h3>
      <p class="post-card-excerpt">${post.excerpt}</p>
      <div class="post-card-footer">
        <span class="badge" style="color:var(--t3);">AI News</span>
        <span class="post-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
      </div>
    </a>`;

  /* ── GLOBAL STATE ── */
  let masterPosts = [];
  let filteredPosts = [];
  let shownCount = 0;
  const PAGE_SIZE = 9;

  function loadMore() {
    const grid = document.getElementById('post-grid');
    const next = filteredPosts.slice(shownCount, shownCount + PAGE_SIZE);
    
    grid.insertAdjacentHTML('beforeend', next.map((post, i) => renderCard(post, shownCount + i)).join(''));
    shownCount += next.length;
    
    // Hide button if we reached the end of filtered array
    if (shownCount >= filteredPosts.length) {
      document.getElementById('load-more-wrap').classList.add('hidden');
    }
  }

  /* ── SEARCH LOGIC ── */
  function handleSearch(query) {
    query = query.toLowerCase().trim();
    const heroSec = document.getElementById('hero-section');
    const gridHeader = document.getElementById('grid-header-label');
    const emptyState = document.getElementById('search-empty-state');
    const grid = document.getElementById('post-grid');
    const loadMoreWrap = document.getElementById('load-more-wrap');

    if (!query) {
      // Restore Default View
      heroSec.style.display = '';
      gridHeader.textContent = "Archive";
      filteredPosts = masterPosts.slice(1); // Exclude hero post from grid
    } else {
      // Search View (Hide Hero, search ALL posts)
      heroSec.style.display = 'none';
      gridHeader.textContent = "Search Results";
      filteredPosts = masterPosts.filter(p => 
        p.title.toLowerCase().includes(query) || 
        p.excerpt.toLowerCase().includes(query)
      );
    }

    // Reset pagination and grid
    shownCount = 0;
    grid.innerHTML = '';
    
    if (filteredPosts.length === 0) {
      grid.style.display = 'none';
      loadMoreWrap.classList.add('hidden');
      emptyState.classList.remove('hidden');
      document.getElementById('search-term-display').textContent = query;
    } else {
      grid.style.display = 'grid';
      emptyState.classList.add('hidden');
      loadMore();
      if (filteredPosts.length > PAGE_SIZE) {
        loadMoreWrap.classList.remove('hidden');
      }
    }
  }

  /* ── DATA FETCHING ── */
  async function init() {
    try {
      let posts = [];

      // 1. Fetch manifest if available
      try {
        const res = await fetch('/ai-news/index.json');
        if (res.ok) posts = await res.json();
      } catch (e) {}

      // 2. Fetch full file list to cross-reference (The Stitch Fix)
      const listRes = await fetch('/ai-news/files.json');
      if (listRes.ok) {
        const files = await listRes.json();
        const recentFiles = [...files].reverse(); 

        if (recentFiles.length > posts.length) {
          const missingFiles = recentFiles.slice(posts.length);
          const fetches = missingFiles.map(f => fetch(`/ai-news/${f}`).then(r => r.ok ? r.text() : null));
          const htmls = await Promise.all(fetches);

          const missingPosts = htmls.map((html, i) => {
            if (!html) return null;
            const slug = missingFiles[i].replace('.html', '');
            return {
              url: `/ai-news/${missingFiles[i]}`,
              title: extractTitle(html, slug),
              excerpt: extractMeta(html) || extractExcerpt(html),
              date: extractDate(html)
            };
          }).filter(Boolean);

          posts = [...posts, ...missingPosts];
        }
      }

      if (posts.length === 0) throw new Error("No content found");

      // Save to global state
      masterPosts = posts;

      // Update UI Headers
      const today = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      document.getElementById('today-date').textContent = today;
      document.getElementById('post-count-display').innerHTML = `${posts.length} <span>articles</span>`;

      // Render Hero
      document.getElementById('hero-skeleton').classList.add('hidden');
      const heroContainer = document.getElementById('hero-post-container');
      heroContainer.innerHTML = renderHero(masterPosts[0]);
      heroContainer.classList.remove('hidden');

      // Initialize Grid via Search logic (passing empty string triggers default view)
      document.getElementById('grid-skeleton').style.display = 'none';
      document.getElementById('grid-header').style.display = 'flex';
      handleSearch('');

    } catch (err) {
      console.warn("Blog initialization failed:", err);
      document.getElementById('hero-section').style.display = 'none';
      document.getElementById('grid-header').style.display = 'none';
      document.getElementById('grid-skeleton').style.display = 'none';
      document.getElementById('post-grid').style.display = 'none';
      document.getElementById('load-more-wrap').style.display = 'none'; 
      document.getElementById('error-state').classList.remove('hidden');
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
