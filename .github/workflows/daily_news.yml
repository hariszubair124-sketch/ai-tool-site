name: Daily AI Researcher
on:
  schedule:
    - cron: '0 5 * * *' # Runs every day at 5:00 AM UTC
  workflow_dispatch: # Allows manual testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Library
        run: pip install -U google-genai

      - name: Run Robot
        env:
          # This maps your GitHub Secret to the variable the script actually uses
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py

      - name: Save and Push to Website
        run: |
          git config --global user.name "AI-Robot"
          git config --global user.email "robot@webonlinetools.com"
          git add .
          # Only commit if the AI actually generated a new file
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 New Daily News Posted: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new changes detected. Skipping commit."
          fi
