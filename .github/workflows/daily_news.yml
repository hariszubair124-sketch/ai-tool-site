name: Daily AI Blog Writer

on:
  schedule:
    - cron: '0 3 * * *'   # 3:00 AM UTC = 8:00 AM PKT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no API call)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-google-genai

      - name: Install Dependencies
        run: pip install -U google-genai

      - name: Run AI Blog Writer
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
        timeout-minutes: 20

      - name: Commit & Push New Post
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "AI-Robot"
          git config --global user.email "robot@webonlinetools.com"
          echo "Last run: $(date +'%Y-%m-%d %H:%M:%S UTC')" > .last-run
          git add .
          git diff --staged --quiet \
            && echo "⚠️ Nothing new to commit." \
            || git commit -m "🤖 Blog Post: $(date +'%Y-%m-%d')"
          git push

      - name: Dry Run Complete
        if: success() && github.event.inputs.dry_run == 'true'
        run: echo "✅ Dry run passed — no files committed to repo."
