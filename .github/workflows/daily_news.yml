name: Daily AI Blog Writer

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no API call)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-google-genai

      - name: Install Dependencies
        run: pip install -U google-genai

      - name: Run AI Blog Writer (Attempt 1)
        id: attempt1
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py
        continue-on-error: true

      - name: Wait and Retry if Quota Hit (Attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "⏳ Attempt 1 failed. Waiting 60 seconds before retry..."
          sleep 60
          python main.py
        continue-on-error: true

      - name: Fail if Both Attempts Failed
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "❌ Both attempts failed. Likely a quota or API issue."
          exit 1

      - name: Commit & Push New Post
        if: steps.attempt1.outcome == 'success' || steps.attempt2.outcome == 'success'
        run: |
          git config --global user.name "AI-Robot"
          git config --global user.email "robot@webonlinetools.com"
          git add ai-news/
          git diff --staged --quiet \
            && echo "⚠️ Nothing new to commit." \
            || git commit -m "🤖 Blog Post: $(date +'%Y-%m-%d')"
          git push
